# 编排定义（M9 · 默认形态）：一条命令起 SQLite + 前后端两服务。
# 依据第三阶段计划 D1 决策：验收按需求文本走 SQLite，PostgreSQL 形态保留在 docker-compose.pg.yml。
#
# 使用：docker compose up -d --build
# 停止：docker compose down（保留数据卷）/ docker compose down -v（连 pft-data 一起删，慎用）
# 数据持久化：SQLite 库文件落在 named volume pft-data 挂载的 /app/data，容器重建不丢（需求七.3）。
#
# 首次启动前需在【仓库根目录】准备 .env（ compose 自动加载），至少填写：
#     SECRET_KEY=<一段足够长的随机串>          # JWT 签名密钥，缺失则本文件直接报错拒绝启动，
#                                              # 以防带着代码里的开发默认密钥“裸奔”上线（需求七.4）。
# 参见 .env.example。数据库迁移由 backend 容器 entrypoint.sh 自动执行 alembic upgrade head（幂等）。

services:
  backend:
    build: ./backend
    environment:
      # 容器内绝对路径（注意 sqlite 四斜杠 //）：库文件落在挂载卷 /app/data 下。
      # database.py 的 ensure_sqlite_dir() 会在建 engine 前兜底 mkdir 父目录。
      DATABASE_URL: sqlite:////app/data/fault_tracker.db
      # :? = 未提供 SECRET_KEY 时 compose 直接报错并打印提示，绝不回退到镜像里的开发默认密钥。
      SECRET_KEY: ${SECRET_KEY:?请在仓库根目录 .env 填写 SECRET_KEY（JWT 签名密钥），详见 README「Docker 部署」}
    volumes:
      # named volume：SQLite 库文件目录持久化，容器重建/重启不丢；仅 down -v 才会删。
      - pft-data:/app/data
    healthcheck:
      # slim 镜像无 curl，用系统 python 的 urllib 探活（探活端点 /api/health）。
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        # 关键概念：depends_on 只保证【启动顺序】，加 condition: service_healthy 才等 backend 就绪。
        condition: service_healthy

volumes:
  # named volume 声明：SQLite 数据目录，生命周期独立于容器（down 不删、down -v 才删）。
  pft-data:
