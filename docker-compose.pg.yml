# 编排覆盖文件（M9 · PostgreSQL 形态）：在主 compose 之上叠加 postgres 服务并切换 backend 方言。
# 依据用户裁定「两种都要」：SQLite 为默认主线（docker-compose.yml），PG 作为可选覆盖保留阶段二 P3 成果。
#
# 使用（显式指定两份文件，后者覆盖/合并前者）：
#     docker compose -f docker-compose.yml -f docker-compose.pg.yml up -d --build
# 停止： docker compose -f docker-compose.yml -f docker-compose.pg.yml down
# 数据卷：PG 数据在 named volume pft-pgdata（down -v 才删）。
#
# 合并语义（Compose 多文件）：同键标量按【覆盖】（backend.DATABASE_URL 换掉），
#   映射/列表按键【合并追加】（新增 postgres 服务、backend 追加对 postgres 的依赖、底部追加卷声明）。
# 迁移仍由 backend entrypoint 跑 alembic upgrade head，对 PG 同样成立（DATABASE_URL 决定方言）。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # 首次启动时 postgres 镜像用这三个变量初始化库/用户/密码（仅空数据卷时生效）。
      # 练习用弱口令；真实部署请连同 SECRET_KEY 一并挪到 .env 并改强。
      POSTGRES_DB: pft
      POSTGRES_USER: pft
      POSTGRES_PASSWORD: pft_pass
    volumes:
      - pft-pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready 比 TCP 探活更准（等的是“能接受连接”）。
      test: ["CMD-SHELL", "pg_isready -U pft -d pft"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    environment:
      # 覆盖主文件的 SQLite URL：scheme 换成 postgresql+psycopg 即驱动 SQLAlchemy 走 psycopg。
      # host 用 compose 服务名 postgres（同网络内 DNS 解析），端口 5432。
      DATABASE_URL: postgresql+psycopg://pft:pft_pass@postgres:5432/pft
      # 图片附件目录 UPLOAD_DIR=/app/data/uploads 不在此重写：环境映射按键合并，
      # 主 docker-compose.yml 的同名变量自动继承。本形态下库已迁入 postgres 容器（pft-pgdata），
      # pft-data 卷剩下的唯一用途就是这份 uploads——备份口径：PG 转储 + uploads 目录两处（见 README 11.5）。
    depends_on:
      # 追加对 postgres 的依赖：等 PG 健康再起 backend，否则 backend entrypoint 迁移即连库会失败。
      postgres:
        condition: service_healthy

volumes:
  # 追加 PG 数据卷声明（与主文件的 pft-data 并存，互不影响）。
  pft-pgdata:
