# Alembic migration configuration.
# NOTE: keep this file ASCII-only to avoid encoding pitfalls on Windows.

[alembic]
script_location = %(here)s/alembic

prepend_sys_path = .

path_separator = os

# database URL.  This is consumed by the user-maintained env.py script only.
# NOTE: this value is a placeholder only.  env.py overrides it with the URL
# from app.config.settings (same source as app/database.py), so the two never
# drift apart.
sqlalchemy.url = sqlite:///./app.db


[post_write_hooks]

# Logging configuration.  This is also consumed by the user-maintained
# env.py script only.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
