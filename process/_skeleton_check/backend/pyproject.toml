# 演示系统 —— backend 项目声明（uv 工作流）
#
# 声明策略：只写直接依赖的主版本下界，精确版本由 uv.lock 锁定（uv lock / uv sync 复现）。
# 升级路径：uv lock --upgrade-package <包名> 单包升级（升级与功能改动分开走）。
# 本文件取代 requirements.txt（迁移记录见 DEPENDENCIES.md）。

[project]
name = "demo-app-backend"
version = "0.1.0"
description = "演示系统后端（FastAPI + SQLAlchemy 2 + SQLite）"
requires-python = ">=3.11"
dependencies = [
    # ---- Web 框架 ----
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",        # [standard] 含 watchfiles/httptools，--reload 硬需求
    # ---- 数据校验 / 配置 ----
    "pydantic>=2.9",
    "pydantic-settings>=2.5",         # 从 .env 读取配置（BaseSettings）
    "python-dotenv>=1.0",             # pydantic-settings 的 .env 解析后端
    # ---- ORM / 数据库 ----
    "SQLAlchemy>=2.0",                # SQLite 驱动为 Python 内置，无需额外安装
    "alembic>=1.20",                  # 数据库迁移；Mako 为其 autogenerate 模板渲染的传递依赖
]

[tool.uv]
package = false                     # 应用项目：不构建、不分发（显式声明）
