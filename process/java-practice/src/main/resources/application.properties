# 端口 8081，避开 Python 后端的 8000
server.port=8081

# 对齐 FastAPI extra="forbid"：JSON 里出现 DTO 没有的字段 → 报错（而不是静默忽略）
# Spring Boot 默认是 false（忽略多余字段），这里改成 true
spring.jackson.deserialization.fail-on-unknown-properties=true

# ===== 第三层：H2 内存数据库 + JPA =====
# H2：内存模式，进程结束数据消失（练习用，不持久化）
spring.datasource.url=jdbc:h2:mem:faultdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ddl-auto=validate：Flyway 独家管 DDL，Hibernate 只校验映射是否匹配
# 对照 Python: 不用 create_all()，由 Alembic 管表结构
# 如果实体与表结构不匹配，启动直接报错（而不是静默建表）
spring.jpa.hibernate.ddl-auto=validate

# 打印 SQL：观察 Hibernate 生成的语句（第三层判定 #3 要用）
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 控制台（浏览器访问 /h2-console 可看表结构，练习用）
spring.h2.console.enabled=true
