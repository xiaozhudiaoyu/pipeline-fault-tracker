# 测试默认配置：禁用 Flyway，用 Hibernate 自动建表（create-drop）
# 这样 CascadeDeleteTest / SetNullOnDeleteTest / NplusOneTest 不受 Flyway 种子数据影响。
# FlywayMigrationTest 通过 @TestPropertySource 单独启用 Flyway。
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
